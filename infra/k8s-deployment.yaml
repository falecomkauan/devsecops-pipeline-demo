# Intentionally insecure Kubernetes manifest, for Checkov to flag.
# Each weakness is annotated with the corresponding CKV check and the fix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          # ISSUE (CKV_K8S_43): image referenced by tag, not digest.
          # ISSUE (CKV_K8S_14): tag 'latest' is mutable.
          image: demo-app:latest
          ports:
            - containerPort: 5000
          # ISSUE (CKV_K8S_8/9): no liveness/readiness probes.
          # ISSUE (CKV_K8S_10/11/12/13): no resource limits/requests defined.
          # ISSUE (CKV_K8S_20): allowPrivilegeEscalation not set to false.
          # ISSUE (CKV_K8S_23): runAsNonRoot not enforced.
          securityContext:
            # VULNERABLE: container runs privileged.
            privileged: true
          env:
            # ISSUE (CKV_K8S_35): secret exposed as plain env var.
            - name: API_KEY
              value: "EXAMPLE_FAKE_API_KEY_PLACEHOLDER_1234"
